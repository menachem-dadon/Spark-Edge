name: QwenStream CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      matrix:
        variant: [avx2, generic]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure, build, and test
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Variant ${{ matrix.variant }} -RunTests
      - name: Launcher and I/O tool smoke
        shell: pwsh
        run: |
          $bin = "build-windows-${{ matrix.variant }}/bin/Release"
          if (-not (Test-Path $bin)) { $bin = "build-windows-${{ matrix.variant }}/bin" }
          & "$bin/qwenstream-iobench.exe" --size-mib 8 --random-reads 128 --format json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:QWENSTREAM_NO_BROWSER = '1'
          $manager = Start-Process -FilePath "$bin/QwenStream.exe" -WorkingDirectory $bin -WindowStyle Hidden -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $status = Invoke-RestMethod http://127.0.0.1:18080/api/status
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $status -or $status.phase -ne 'stopped') { throw 'Manager status smoke failed' }
            $config = Invoke-RestMethod http://127.0.0.1:18080/api/config
            if ($config.ctx_size -ne 0 -or $config.mtp_enabled) { throw 'Manager config defaults are invalid' }
            $html = Invoke-WebRequest http://127.0.0.1:18080/ -UseBasicParsing
            if ($html.Content -notmatch 'QwenStream Control Center') { throw 'Dashboard asset was not served' }
          } finally {
            Stop-Process -Id $manager.Id -Force -ErrorAction SilentlyContinue
          }

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [avx2, generic]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: ./scripts/build-linux.sh ${{ matrix.variant }}
      - name: I/O tool smoke
        run: ./build-linux-${{ matrix.variant }}/bin/qwenstream-iobench --size-mib 8 --random-reads 128 --format json

  source-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Required artifacts and forbidden secrets
        run: |
          test -f UPSTREAM_BASE.txt
          test -f THIRD_PARTY_NOTICES.md
          test -f docs/DECISIONS.md
          test -f docs/PROJECT_MAP.md
          test -f docs/SUPPORTED_MODELS.md
          test -f tools/qwenstream/dashboard.html
          ! git grep -nE 'hf_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}'
          ! git ls-files | grep -E '(^|/)(build[^/]*/|node_modules/|artifacts/release/)'
          git diff --check

  chat-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json
      - run: npm ci
      - run: npm run check
