name: QwenStream release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-2022
    strategy:
      matrix:
        variant: [avx2, generic]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: pwsh
        run: ./scripts/build-windows.ps1 -Variant ${{ matrix.variant }} -RunTests
      - shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir "build-windows-${{ matrix.variant }}" -Variant ${{ matrix.variant }}
      - if: matrix.variant == 'avx2'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: artifacts/release/*

  linux-archives:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [avx2, generic]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-linux.sh ${{ matrix.variant }}
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="qwenstream-${version}-linux-x64-${{ matrix.variant }}"
          mkdir -p "$stage/config" "$stage/licenses"
          cp build-linux-${{ matrix.variant }}/bin/{QwenStream,llama-cli,llama-server,llama-bench,qwenstream-iobench} "$stage/"
          cp -r config/presets "$stage/config/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md VERSION "$stage/licenses/"
          tar -czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}
          path: |
            *.tar.gz
            SHA256SUMS

  publish-alpha:
    needs: [windows-portable, linux-archives]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release/**
