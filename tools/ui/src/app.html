<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<link rel="icon" href="favicon.ico" sizes="48x48" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<style>
			#spark-edge-boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				z-index: 900;
				background: #070b16;
			}
			#spark-edge-boot img { width: clamp(88px, 18vw, 168px); height: auto; }
			#spark-edge-boot.is-playing { animation: spark-edge-reveal 240ms ease-out 1.52s both; }
			@keyframes spark-edge-reveal { to { opacity: 0; visibility: hidden; } }
			@media (prefers-reduced-motion: reduce) {
				#spark-edge-boot.is-playing { animation-delay: 260ms; }
			}
		</style>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="spark-edge-boot" aria-hidden="true"></div>
		<script>
			const splash = document.getElementById('spark-edge-boot');
			const playSplash = () => requestAnimationFrame(() => requestAnimationFrame(() => {
				const icon = new Image(168, 168);
				icon.alt = '';
				icon.onload = icon.onerror = () => splash.classList.add('is-playing');
				splash.addEventListener('animationend', () => splash.remove(), { once: true });
				icon.src = matchMedia('(prefers-reduced-motion: reduce)').matches
					? 'spark-edge-static.svg'
					: 'spark-edge-boot.svg';
				splash.append(icon);
			}));
			if (window.sparkEdgeNative) {
				window.addEventListener('spark-edge-visible', playSplash, { once: true });
			} else {
				playSplash();
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
