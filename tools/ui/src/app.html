<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<link rel="icon" href="favicon.ico" sizes="48x48" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
        <style>
            #spark-edge-boot {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                z-index: 900;
                background: #070b16;
                pointer-events: none;
                animation: spark-edge-reveal 240ms ease-out 1.52s both;
            }
            #spark-edge-boot img { width: clamp(88px, 18vw, 168px); height: auto; }
            #spark-edge-boot picture { display: grid; place-items: center; }
            @keyframes spark-edge-reveal { to { opacity: 0; visibility: hidden; } }
            @media (prefers-reduced-motion: reduce) {
                #spark-edge-boot { animation-delay: 260ms; }
            }
        </style>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
        <div id="spark-edge-boot" aria-hidden="true">
            <picture>
                <source media="(prefers-reduced-motion: reduce)" srcset="spark-edge-static.svg" />
                <img src="spark-edge-boot.svg" alt="" width="168" height="168" />
            </picture>
        </div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
